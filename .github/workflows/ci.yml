name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SERENITY_RUN_PAID_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn golden:gate
